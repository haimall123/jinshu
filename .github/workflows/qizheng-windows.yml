name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches: [tauri-build]
    paths:
      - 'qizheng-tauri/**'
      - '.github/workflows/qizheng-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: qizheng-tauri
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm-community
          java-version: '21.0.2'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qizheng-tauri/package-lock.json
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build calculation engine
        run: ./engine/build.ps1
      - name: Compare with original sample results
        run: python ./engine/verify.py
      - name: Install frontend build dependencies
        run: npm ci
      - name: Build portable application
        run: npm run build:portable
      - name: Assemble portable package
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/jinshu-qizheng.exe portable/人生规划.exe
          Copy-Item src-tauri/resources/runtime portable/runtime -Recurse
          Copy-Item README.md portable/
      - uses: actions/upload-artifact@v4
        with:
          name: qizheng-windows-${{ github.sha }}
          if-no-files-found: error
          path: qizheng-tauri/portable/