[package]
name = "jinshu-qizheng"
version = "0.5.3"
description = "人生规划"
edition = "2021"
license = "GPL-2.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
dunce = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
